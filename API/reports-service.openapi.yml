openapi: 3.2.1
info:
  title: Yanki Reports Service API
  description: |
    API de solo lectura para reportes y analítica de productos financieros.

    El servicio consume eventos de dominio de Kafka (20 topics) y los proyecta en colecciones MongoDB
    para generar reportes agregados sin depender de otros servicios por REST (patrón CQRS read-side).

    **Capacidades:**
    - Reportes agregados por tipo de producto y rango de fechas
    - Listado de eventos de producto filtrados por período (streaming NDJSON)
    - Reporte completo de cliente con todos sus productos y eventos (Vista 360°)
    - Últimos movimientos de tarjeta (crédito o débito)
    - Resumen 360° consolidado del cliente (colección customer_summary)
    - Resumen de producto específico (colección product_summary)
    - Agregados diarios para dashboards y analítica (colección daily_aggregates)

    **Arquitectura:**
    - Hexagonal con puertos de entrada/salida
    - Reactivo no bloqueante (RxJava 3 + Spring WebFlux)
    - Cache Redis con TTL 2-5 minutos
    - Consumidor Kafka idempotente (20 topics)
    - 5 colecciones MongoDB: product_events, processed_events, customer_summary, product_summary, daily_aggregates
  version: 1.0.0
  contact:
    name: Platform - Analytics & Reporting
    email: semorale@emeal.nttdata.com
servers:
  - url: http://localhost:8088/api/reports
    description: Servidor local de desarrollo (puerto 8088)
security:
  - Bearer Authentication: []
paths:
  /aggregated:
    get:
      tags:
        - Reportes
      summary: Reporte agregado por tipo de producto
      description: |
        Genera un reporte agregado para un tipo de producto y rango de fechas.
        Calcula la cantidad de eventos, suma total y promedio de montos.

        **Parámetros obligatorios:**
        - `type`: tipo de producto (ACCOUNT, CARD, CREDIT, WALLET)
        - `from`: fecha inicial del rango (ISO 8601: yyyy-MM-dd)
        - `to`: fecha final del rango (ISO 8601: yyyy-MM-dd)
        - `customerType`: tipo de cliente (NATURAL, JURIDICA)

        **Casos de uso:** Dashboard ejecutivo, KPIs por producto, análisis de tendencias.

        **Fuente:** Colección product_events materializada por eventos Kafka.
      operationId: getAggregatedReport
      parameters:
        - name: type
          in: query
          required: true
          description: Tipo de producto a filtrar
          schema:
            type: string
            enum:
              - ACCOUNT
              - CARD
              - CREDIT
              - WALLET
            example: ACCOUNT
        - name: from
          in: query
          required: true
          description: Fecha inicial del rango de fechas (inclusive, ISO-8601)
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: to
          in: query
          required: true
          description: Fecha final del rango de fechas (inclusive, ISO-8601)
          schema:
            type: string
            format: date
            example: "2024-12-31"
        - name: customerType
          in: query
          required: true
          description: Tipo de cliente a filtrar
          schema:
            type: string
            enum:
              - NATURAL
              - JURIDICA
            example: NATURAL
      responses:
        "200":
          description: Reporte agregado obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedReportResponse'
        "400":
          description: Parámetros inválidos: tipo no reconocido, rango inválido (from > to) o tipo cliente no válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 400
                error: "Bad Request"
                code: "INVALID_DATE_RANGE"
                message: "La fecha inicial debe ser anterior a la fecha final"
                path: "/api/reports/aggregated"
                details: []
        "401":
          description: No autorizado: token JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Prohibido: rol sin permiso para acceder a reportes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno en agregación MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 500
                error: "Internal Server Error"
                code: "REPORT_GENERATION_FAILED"
                message: "Error interno generando el reporte"
                path: "/api/reports/aggregated"
                details: []
        "503":
          description: Servicio no disponible: lag Kafka alto (proyección degradada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 503
                error: "Service Unavailable"
                code: "KAFKA_LAG_HIGH"
                message: "Lag de Kafka alto detectado. La proyección puede estar degradada."
                path: "/api/reports/aggregated"
                details: []

  /products:
    get:
      tags:
        - Eventos
      summary: Eventos de producto por rango de fechas (streaming)
      description: |
        Retorna el flujo completo de eventos de producto proyectados desde Kafka a MongoDB
        dentro de un rango de fechas especificado.

        Cada evento incluye información completa: tipo de evento, identificadores, montos,
        saldo posterior, metadata adicional y timestamps.

        **Casos de uso:** Auditoría de eventos, reconstrucción de estado, debugging de proyecciones.

        **Nota:** Retorna un flujo reactivo (Server-Sent Events, NDJSON). La respuesta puede contener
        miles de eventos dependiendo del rango de fechas.
      operationId: getProductsByDateRange
      parameters:
        - name: from
          in: query
          required: true
          description: Fecha inicial del rango (inclusive, ISO-8601)
          schema:
            type: string
            format: date
            example: "2024-06-01"
        - name: to
          in: query
          required: true
          description: Fecha final del rango (inclusive, ISO-8601)
          schema:
            type: string
            format: date
            example: "2024-06-30"
      responses:
        "200":
          description: Flujo de eventos obtenido exitosamente (NDJSON streaming).
          content:
            application/x-ndjson:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductEventResponse'
        "400":
          description: Parámetros inválidos: rango de fechas inválido (from > to).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 400
                error: "Bad Request"
                code: "INVALID_DATE_RANGE"
                message: "La fecha inicial debe ser anterior a la fecha final"
                path: "/api/reports/products"
                details: []
        "401":
          description: No autorizado: token JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Prohibido: rol sin permiso para acceder a eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno consultando eventos de MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Servicio no disponible: lag Kafka alto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/{customerId}:
    get:
      tags:
        - Clientes
      summary: Reporte completo de cliente (Vista 360°)
      description: |
        Agrega todos los productos (cuentas, tarjetas, créditos, wallets) asociados a un cliente
        con sus eventos correspondientes, organizados por tipo de producto.

        La respuesta incluye:
        - **customerId**: Identificador del cliente
        - **products**: Lista de grupos de productos, cada uno con:
          - **aggregateId**: ID del producto (accountId, cardId, etc.)
          - **productType**: Tipo (ACCOUNT, CARD, CREDIT, WALLET)
          - **subType**: Subtipo (SAVINGS, CREDIT, PERSONAL_LOAN, etc.)
          - **events**: Lista de eventos asociados al producto

        **Casos de uso:** Vista 360° del cliente, atención al cliente, análisis de cross-selling.

        **Nota:** Si el cliente no tiene eventos registrados, se retorna un objeto vacío con products = [].
        No se lanza 404, ya que el cliente puede existir sin haber generado eventos aún.
      operationId: getCustomerReport
      parameters:
        - name: customerId
          in: path
          required: true
          description: Identificador único del cliente
          schema:
            type: string
            example: "6af39f59b089e973a5ffe9b6"
      responses:
        "200":
          description: Reporte del cliente obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerReportResponse'
        "401":
          description: No autorizado: token JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Prohibido: rol sin permiso para ver reportes de cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno agregando productos desde MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Servicio no disponible: lag Kafka alto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /movements/cards/{cardId}:
    get:
      tags:
        - Tarjetas
      summary: Últimos movimientos de tarjeta (Req. Parte II)
      description: |
        Consulta optimizada para obtener los movimientos más recientes de una tarjeta
        de crédito o débito, ordenados por fecha de ocurrencia (más reciente primero).

        La respuesta incluye:
        - **cardId**: Identificador de la tarjeta
        - **productType**: Tipo de producto (CARD)
        - **subType**: Subtipo de tarjeta (CREDIT, DEBIT)
        - **movements**: Lista de eventos de consumo/pago asociados a la tarjeta

        **Casos de uso:** Estado de cuenta en tiempo real, disputas de transacciones,
        monitoreo de actividad sospechosa.

        **Nota:** El parámetro `limit` permite controlar el número de movimientos retornados
        (por defecto 10, máximo recomendado 100 para rendimiento óptimo).
      operationId: getCardMovements
      parameters:
        - name: cardId
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
            example: "CARD-12345"
        - name: limit
          in: query
          required: false
          description: Número máximo de movimientos a retornar (default: 10, máx: 100)
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100
            example: 10
      responses:
        "200":
          description: Movimientos de tarjeta obtenidos exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardMovementsResponse'
        "404":
          description: Tarjeta no encontrada: no hay eventos para el cardId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 404
                error: "Not Found"
                code: "PRODUCT_NOT_FOUND"
                message: "No report data found for cardId CARD-12345"
                path: "/api/reports/movements/cards/CARD-12345"
                details: []
        "401":
          description: No autorizado: token JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Prohibido: rol sin permiso para ver movimientos de tarjeta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno consultando MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Servicio no disponible: lag Kafka alto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customer-summary/{customerId}:
    get:
      tags:
        - Resúmenes
      summary: Resumen 360° del cliente
      description: |
        Obtiene el resumen consolidado de un cliente con totales de cuentas, tarjetas,
        créditos y wallets, así como saldos acumulados y estado de deudas vencidas.

        La respuesta incluye:
        - **customerId**: Identificador del cliente
        - **customerType**: Tipo de cliente (NATURAL, JURIDICA)
        - **profile**: Perfil (PERSONAL, VIP, PYME, EMPRESARIAL)
        - **status**: Estado (ACTIVE, INACTIVE, BLOCKED)
        - **totalAccounts/totalCards/totalCredits/totalWallets**: Contadores de productos
        - **totalBalanceAccounts**: Saldo total en cuentas bancarias
        - **totalCreditLimit/totalCreditDebt**: Límite y deuda de créditos
        - **totalWalletBalance**: Saldo total en wallets
        - **hasOverdueDebt**: Indica si tiene deudas vencidas

        **Casos de uso:** Dashboard de cliente, scoring crediticio, análisis de relación cliente-banco.

        **Fuente:** Colección customer_summary materializada por eventos Kafka.
      operationId: getCustomerSummary
      parameters:
        - name: customerId
          in: path
          required: true
          description: Identificador único del cliente
          schema:
            type: string
            example: "6af39f59b089e973a5ffe9b6"
      responses:
        "200":
          description: Resumen del cliente obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSummaryResponse'
        "404":
          description: Cliente no encontrado: no hay resumen materializado para este customerId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 404
                error: "Not Found"
                code: "PRODUCT_NOT_FOUND"
                message: "No customer summary found for customerId 6af39f59b089e973a5ffe9b6"
                path: "/api/reports/customer-summary/6af39f59b089e973a5ffe9b6"
                details: []
        "401":
          description: No autorizado: token JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Prohibido: rol sin permiso para ver resumen de cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno consultando MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Servicio no disponible: lag Kafka alto (proyección degradada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}:
    get:
      tags:
        - Resúmenes
      summary: Resumen de producto específico
      description: |
        Obtiene el estado actual de un producto bancario (cuenta, tarjeta, crédito o wallet)
        con saldos, límites y estado.

        La respuesta incluye:
        - **productId**: Identificador del producto
        - **productType**: Tipo (ACCOUNT, CARD, CREDIT, WALLET)
        - **subType**: Subtipo (SAVINGS, CREDIT, DEBIT, PERSONAL_LOAN, etc.)
        - **customerId**: Cliente propietario
        - **status**: Estado (OPEN, ACTIVE, CLOSED, BLOCKED, OVERDUE)
        - **currentBalance**: Saldo actual (cuentas y wallets)
        - **creditLimit/availableLimit**: Límites de crédito (tarjetas)
        - **outstandingBalance**: Saldo pendiente (créditos)
        - **currency**: Moneda (PEN, USD)
        - **openedAt/closedAt/lastMovementAt**: Timestamps clave

        **Casos de uso:** Consulta de estado de producto, validación de límites, monitoreo de productos.

        **Fuente:** Colección product_summary materializada por eventos Kafka.
      operationId: getProductSummary
      parameters:
        - name: productId
          in: path
          required: true
          description: Identificador único del producto (accountId, cardId, creditId, walletId)
          schema:
            type: string
            example: "ACC-12345"
      responses:
        "200":
          description: Resumen del producto obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummaryResponse'
        "404":
          description: Producto no encontrado: no hay resumen materializado para este productId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 404
                error: "Not Found"
                code: "PRODUCT_NOT_FOUND"
                message: "No product summary found for productId ACC-12345"
                path: "/api/reports/products/ACC-12345"
                details: []
        "401":
          description: No autorizado: token JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Prohibido: rol sin permiso para ver resumen de producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno consultando MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Servicio no disponible: lag Kafka alto (proyección degradada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /daily-aggregates:
    get:
      tags:
        - Resúmenes
      summary: Agregados diarios para dashboards y analítica
      description: |
        Obtiene las métricas diarias consolidadas por tipo de producto y tipo de cliente.

        La respuesta incluye:
        - **id**: Identificador compuesto (YYYY-MM-DD:PRODUCT_TYPE:CUSTOMER_TYPE)
        - **date**: Fecha del día agregado
        - **productType**: Tipo de producto (ACCOUNT, CARD, CREDIT, WALLET)
        - **customerType**: Tipo de cliente (NATURAL, JURIDICA)
        - **movementCount**: Cantidad total de movimientos en el día
        - **totalAmount**: Monto total acumulado en el día
        - **avgAmount**: Monto promedio por movimiento
        - **uniqueCustomers**: Clientes únicos con movimientos
        - **uniqueProducts**: Productos únicos con movimientos

        **Casos de uso:** Dashboards operativos, reportes diarios, análisis de volumen transaccional.

        **Fuente:** Colección daily_aggregates materializada por eventos Kafka.
      operationId: getDailyAggregates
      parameters:
        - name: date
          in: query
          required: true
          description: Fecha del día para obtener agregados (ISO-8601)
          schema:
            type: string
            format: date
            example: "2024-06-15"
        - name: productType
          in: query
          required: false
          description: Filtro opcional por tipo de producto. Si no se especifica, retorna todos los tipos.
          schema:
            type: string
            enum:
              - ACCOUNT
              - CARD
              - CREDIT
              - WALLET
            example: ACCOUNT
      responses:
        "200":
          description: Agregados diarios obtenidos exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyAggregateResponse'
        "400":
          description: Parámetros inválidos: fecha inválida o tipo de producto no reconocido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: No autorizado: token JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Prohibido: rol sin permiso para ver agregados diarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno consultando MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Servicio no disponible: lag Kafka alto (proyección degradada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    Bearer Authentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido desde el auth-service. Validado por el API Gateway.

  schemas:
    ProductEventResponse:
      type: object
      description: Evento de producto proyectado desde Kafka a MongoDB.
      properties:
        id:
          type: string
          description: Identificador único del evento (UUID)
          example: "evt-001"
        eventType:
          type: string
          description: Tipo de evento (ej. CARD_CONSUMPTION, ACCOUNT_OPENED, CREDIT_PAYMENT)
          example: "CARD_CONSUMPTION"
        aggregateId:
          type: string
          description: Identificador del agregado al que pertenece el evento (accountId, cardId, creditId, walletId)
          example: "card-123"
        customerId:
          type: string
          description: Identificador del cliente asociado al evento
          example: "cust-456"
        productType:
          type: string
          description: Tipo de producto (ACCOUNT, CARD, CREDIT, WALLET, CUSTOMER)
          example: "CARD"
        subType:
          type: string
          description: Subtipo del producto (SAVINGS, CREDIT, PERSONAL_LOAN, etc.)
          example: "CREDIT"
        amount:
          type: number
          format: double
          description: Monto del evento (si aplica)
          example: 150.50
        balanceAfter:
          type: number
          format: double
          description: Saldo posterior al evento (si aplica)
          example: 4500.00
        metadata:
          type: object
          additionalProperties: true
          description: Campos adicionales del payload original del evento
        occurredAt:
          type: string
          format: date-time
          description: Timestamp del evento (del payload original, ISO-8601)
          example: "2026-11-14T10:30:00"
        ingestedAt:
          type: string
          format: date-time
          description: Timestamp de ingesta en el servicio de reportes (ISO-8601)
          example: "2026-11-14T10:30:05"

    AggregatedReportResponse:
      type: object
      description: Reporte agregado con estadísticas de eventos para un tipo de producto y rango de fechas.
      properties:
        count:
          type: integer
          format: int32
          description: Cantidad total de eventos en el rango
          example: 150
        sumAmount:
          type: number
          format: double
          description: Suma total de montos de los eventos
          example: 25000.00
        averageAmount:
          type: number
          format: double
          description: Promedio de montos (suma / count, redondeado a 2 decimales)
          example: 166.67
        type:
          type: string
          description: Tipo de producto consultado
          example: "CARD"
        dateRange:
          $ref: '#/components/schemas/DateRange'
        customerType:
          type: string
          description: Tipo de cliente utilizado como filtro
          example: "NATURAL"

    DateRange:
      type: object
      description: Rango de fechas utilizado en los reportes.
      properties:
        from:
          type: string
          format: date
          description: Fecha inicial del rango (inclusive, ISO-8601)
          example: "2024-01-01"
        to:
          type: string
          format: date
          description: Fecha final del rango (inclusive, ISO-8601)
          example: "2024-12-31"

    CustomerReportResponse:
      type: object
      description: Reporte completo de un cliente con todos sus productos y eventos asociados.
      properties:
        customerId:
          type: string
          description: Identificador único del cliente
          example: "cust-456"
        products:
          type: array
          description: Lista de productos agrupados por aggregateId
          items:
            $ref: '#/components/schemas/ProductGroup'

    ProductGroup:
      type: object
      description: |
        Agrupación de eventos por producto. Cada grupo representa un producto
        (cuenta, tarjeta, crédito, wallet) identificado por su `aggregateId` con sus eventos asociados.
      properties:
        aggregateId:
          type: string
          description: Identificador único del producto (accountId, cardId, creditId, walletId)
          example: "card-123"
        productType:
          type: string
          description: Tipo de producto (ACCOUNT, CARD, CREDIT, WALLET)
          example: "CARD"
        subType:
          type: string
          description: Subtipo del producto (SAVINGS, CREDIT, PERSONAL_LOAN, etc.)
          example: "CREDIT"
        events:
          type: array
          description: Lista de eventos asociados al producto, ordenados por fecha descendente
          items:
            $ref: '#/components/schemas/ProductEventResponse'

    CardMovementsResponse:
      type: object
      description: Respuesta con los últimos movimientos de una tarjeta de crédito o débito.
      properties:
        cardId:
          type: string
          description: Identificador único de la tarjeta
          example: "card-123"
        productType:
          type: string
          description: Tipo de producto (CARD)
          example: "CARD"
        subType:
          type: string
          description: Subtipo de la tarjeta (CREDIT, DEBIT)
          example: "CREDIT"
        movements:
          type: array
          description: Lista de movimientos ordenados por fecha descendente
          items:
            $ref: '#/components/schemas/ProductEventResponse'

    CustomerSummaryResponse:
      type: object
      description: Resumen 360° consolidado del cliente con totales de productos y saldos.
      properties:
        customerId:
          type: string
          description: Identificador único del cliente
          example: "6af39f59b089e973a5ffe9b6"
        customerType:
          type: string
          description: Tipo de cliente
          enum:
            - NATURAL
            - JURIDICA
          example: "NATURAL"
        profile:
          type: string
          description: Perfil del cliente según segmentación bancaria
          enum:
            - PERSONAL
            - VIP
            - PYME
            - EMPRESARIAL
          example: "PERSONAL"
        status:
          type: string
          description: Estado actual del cliente
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
          example: "ACTIVE"
        totalAccounts:
          type: integer
          format: int32
          description: Total de cuentas bancarias activas
          example: 3
        totalCards:
          type: integer
          format: int32
          description: Total de tarjetas activas (débito y crédito)
          example: 2
        totalCredits:
          type: integer
          format: int32
          description: Total de créditos activos
          example: 1
        totalWallets:
          type: integer
          format: int32
          description: Total de wallets digitales activas
          example: 1
        totalBalanceAccounts:
          type: number
          format: double
          description: Saldo total acumulado en todas las cuentas bancarias (en moneda local)
          example: 15000.50
        totalCreditLimit:
          type: number
          format: double
          description: Límite total de crédito disponible entre todos los créditos
          example: 50000.00
        totalCreditDebt:
          type: number
          format: double
          description: Deuda total acumulada en todos los créditos
          example: 12000.00
        totalWalletBalance:
          type: number
          format: double
          description: Saldo total acumulado en todas las wallets digitales
          example: 500.00
        hasOverdueDebt:
          type: boolean
          description: Indica si el cliente tiene deudas vencidas en algún crédito
          example: false
        lastMovementAt:
          type: string
          format: date-time
          description: Timestamp del último movimiento registrado para este cliente (ISO-8601)
          example: "2024-06-15T10:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp de última actualización del resumen (ISO-8601)
          example: "2024-06-15T10:30:05"

    ProductSummaryResponse:
      type: object
      description: Resumen del estado actual de un producto bancario.
      properties:
        productId:
          type: string
          description: Identificador único del producto
          example: "ACC-12345"
        productType:
          type: string
          description: Tipo de producto bancario
          enum:
            - ACCOUNT
            - CARD
            - CREDIT
            - WALLET
          example: "ACCOUNT"
        subType:
          type: string
          description: Subtipo del producto según categoría
          enum:
            - SAVINGS
            - CURRENT
            - FIXED_TERM
            - CREDIT
            - DEBIT
            - PERSONAL_LOAN
            - WALLET
          example: "SAVINGS"
        customerId:
          type: string
          description: Identificador del cliente propietario del producto
          example: "6af39f59b089e973a5ffe9b6"
        status:
          type: string
          description: Estado actual del producto
          enum:
            - OPEN
            - ACTIVE
            - CLOSED
            - BLOCKED
            - OVERDUE
          example: "ACTIVE"
        currentBalance:
          type: number
          format: double
          description: Saldo actual del producto (aplica para cuentas y wallets)
          example: 5000.00
        creditLimit:
          type: number
          format: double
          description: Límite total de crédito (aplica para tarjetas de crédito)
          example: 10000.00
        availableLimit:
          type: number
          format: double
          description: Límite disponible para uso (aplica para tarjetas de crédito)
          example: 7500.00
        outstandingBalance:
          type: number
          format: double
          description: Saldo pendiente de pago (aplica para créditos)
          example: 8000.00
        currency:
          type: string
          description: Moneda del producto
          enum:
            - PEN
            - USD
          example: "PEN"
        openedAt:
          type: string
          format: date-time
          description: Timestamp de apertura del producto (ISO-8601)
          example: "2024-01-15T09:00:00"
        closedAt:
          type: string
          format: date-time
          description: Timestamp de cierre del producto si está cerrado (ISO-8601, null si está activo)
          example: "null"
        lastMovementAt:
          type: string
          format: date-time
          description: Timestamp del último movimiento del producto (ISO-8601)
          example: "2024-06-15T14:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp de última actualización del resumen (ISO-8601)
          example: "2024-06-15T14:30:05"

    DailyAggregateResponse:
      type: object
      description: Agregados diarios consolidados para dashboards y analítica.
      properties:
        id:
          type: string
          description: Identificador único compuesto en formato YYYY-MM-DD:PRODUCT_TYPE:CUSTOMER_TYPE
          example: "2024-06-15:ACCOUNT:NATURAL"
        date:
          type: string
          format: date
          description: Fecha del día agregado (ISO-8601)
          example: "2024-06-15"
        productType:
          type: string
          description: Tipo de producto bancario
          enum:
            - ACCOUNT
            - CARD
            - CREDIT
            - WALLET
          example: "ACCOUNT"
        customerType:
          type: string
          description: Tipo de cliente
          enum:
            - NATURAL
            - JURIDICA
          example: "NATURAL"
        movementCount:
          type: integer
          format: int32
          description: Cantidad total de movimientos registrados en el día
          example: 150
        totalAmount:
          type: number
          format: double
          description: Monto total acumulado de todos los movimientos del día
          example: 75000.00
        avgAmount:
          type: number
          format: double
          description: Monto promedio por movimiento en el día (totalAmount / movementCount)
          example: 500.00
        uniqueCustomers:
          type: integer
          format: int32
          description: Cantidad de clientes únicos con movimientos en el día
          example: 45
        uniqueProducts:
          type: integer
          format: int32
          description: Cantidad de productos únicos con movimientos en el día
          example: 60
        updatedAt:
          type: string
          format: date-time
          description: Timestamp de última actualización del agregado (ISO-8601)
          example: "2024-06-15T23:59:59"

    ErrorResponse:
      type: object
      description: Estructura unificada de respuesta de error manejada por GlobalExceptionHandler.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp del error (ISO-8601)
          example: "2026-11-15T10:30:00"
        status:
          type: integer
          format: int32
          description: Código HTTP de estado
          example: 404
        error:
          type: string
          description: Descripción breve del error (razón HTTP)
          example: "Not Found"
        code:
          type: string
          description: Código de error semántico del dominio
          example: "PRODUCT_NOT_FOUND"
        message:
          type: string
          description: Mensaje detallado del error
          example: "No report data found for cardId CARD-123"
        path:
          type: string
          description: Ruta del endpoint que generó el error
          example: "/api/reports/movements/cards/CARD-123"
        details:
          type: array
          description: Detalles adicionales del error (validación, contexto)
          items:
            type: string
      example:
        timestamp: "2026-11-15T10:30:00"
        status: 404
        error: "Not Found"
        code: "PRODUCT_NOT_FOUND"
        message: "No report data found for cardId CARD-123"
        path: "/api/reports/movements/cards/CARD-123"
        details: []

  tags:
    - name: Reportes
      description: Endpoints para reportes agregados por tipo de producto y rango de fechas
    - name: Eventos
      description: Endpoints para consulta de eventos de producto (streaming NDJSON)
    - name: Clientes
      description: Endpoints para reportes completos de clientes (Vista 360°)
    - name: Tarjetas
      description: Endpoints para movimientos de tarjetas de crédito y débito
    - name: Resúmenes
      description: Endpoints para resúmenes consolidados (customer_summary, product_summary, daily_aggregates)
