server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: reports-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: yanki_reports
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:reports-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.yanki.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    config:
      fail-fast: false
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true
    try-it-out-enabled: true
    filter: true
  info:
    title: Yanki Reports Service API
    description: >
      API de reportes y analítica — CQRS read-only.
      Consume eventos de dominio de 20 topics Kafka y proyecta en MongoDB para generar reportes.
    version: 1.0.0
    contact:
      name: Platform - Analytics & Reporting
      email: semorale@emeal.nttdata.com
  show-actuator: false

logging:
  level:
    com.yanki: INFO
    org.apache.kafka.clients: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
